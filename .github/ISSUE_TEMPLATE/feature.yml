name: Feature proposal
description: Propose a product, platform, game, lore, or contributor improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What human or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website
        - Game
        - Living Chronicle
        - Aster / AI
        - MCP / agents
        - Privacy / consent
        - Security
        - Lore / content
        - Open-source tooling
        - Accessibility
        - Research (deferred)
  - type: textarea
    id: boundaries
    attributes:
      label: Constitutional and safety boundaries
      description: Explain relevant Seven Laws, privacy, health-safety, accessibility, or canon constraints.
  - type: checkboxes
    id: data
    attributes:
      label: Data boundary
      options:
        - label: This proposal can be developed and tested with public or synthetic data only.
          required: true
