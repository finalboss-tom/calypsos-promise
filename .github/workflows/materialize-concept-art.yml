name: Diagnose concept art staging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".asset-staging/**"
      - ".github/workflows/materialize-concept-art.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Inspect staged payloads
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          lines = []
          for name in ("hero", "aster", "ogygia"):
              parts = sorted(Path(f".asset-staging/{name}").glob("part-*"))
              encoded = b"".join(part.read_bytes() for part in parts)
              compact = b"".join(encoded.split())
              lines.append(f"[{name}]")
              lines.append(f"parts={len(parts)}")
              lines.append(f"encoded_bytes={len(encoded)}")
              lines.append(f"compact_bytes={len(compact)}")
              try:
                  decoded = base64.b64decode(compact, validate=False)
                  lines.append(f"decoded_bytes={len(decoded)}")
                  lines.append(f"sha256={hashlib.sha256(decoded).hexdigest()}")
                  lines.append(f"header={decoded[:16].hex()}")
              except Exception as error:
                  lines.append(f"decode_error={type(error).__name__}: {error}")
              lines.append("")
          Path(".asset-diagnostics.txt").write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .asset-diagnostics.txt
          git commit -m "chore: record concept-art staging diagnostics"
          git push origin HEAD:${{ github.head_ref }}
