name: Apply funding formatting fixes

on:
  push:
    branches:
      - institution/phase-0-funding-sponsorship-baseline
    paths:
      - .github/workflows/apply-funding-formatting-fixes.yml

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out funding branch
        uses: actions/checkout@v7
        with:
          ref: institution/phase-0-funding-sponsorship-baseline

      - name: Download formatter output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/funding-formatting
          gh run download 30225247546 \
            --repo "$GITHUB_REPOSITORY" \
            --name formatting-fixes \
            --dir /tmp/funding-formatting

      - name: Apply generated files
        run: |
          tar -xzf /tmp/funding-formatting/formatted-files.tar.gz -C "$GITHUB_WORKSPACE"
          rm .github/workflows/apply-funding-formatting-fixes.yml

      - name: Commit generated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/README.md \
            docs/economics/funding-concentration-and-continuity-policy.md \
            docs/economics/funding-synthetic-scenarios-and-tabletops.md \
            docs/economics/phase-0-funding-completion-record.md \
            .github/workflows/apply-funding-formatting-fixes.yml
          git commit -m "chore: apply generated formatting fixes"
          git push origin HEAD:institution/phase-0-funding-sponsorship-baseline
