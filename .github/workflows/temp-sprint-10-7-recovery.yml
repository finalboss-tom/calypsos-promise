name: Temporary Sprint 10.7 race-safe recovery

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-7-recovery.yml

permissions:
  contents: write

jobs:
  recover-validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply archive if implementation is not already present
        run: |
          if [ -f tools/temp-sprint-10-7/archive.b64 ]; then
            python - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded = "".join(Path("tools/temp-sprint-10-7/archive.b64").read_text().split())
          payload = base64.b64decode(encoded, validate=True)
          print(f"archive_sha256={hashlib.sha256(payload).hexdigest()}")
          with gzip.GzipFile(fileobj=io.BytesIO(payload), mode="rb") as stream:
              tar_bytes = stream.read()

          allowed_document = "docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md"
          allowed_script = "tools/apply-sprint-10-7.py"
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("archive is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsupported archive member type: {member.name}")
                  allowed = (
                      member.name in {"apps", "apps/game", "docs", "docs/roadmap", "tools", allowed_document, allowed_script}
                      or member.name.startswith("apps/game/")
                  )
                  if not allowed:
                      raise SystemExit(f"unexpected archive member: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported archive member: {member.name}")
              archive.extractall(path=Path.cwd(), filter="data")
          PY
            if [ -f tools/apply-sprint-10-7.py ]; then
              python tools/apply-sprint-10-7.py
              rm tools/apply-sprint-10-7.py
            fi
          else
            test -f apps/game/scripts/validate-authentication-boundary.mjs
            test -f docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md
          fi

      - name: Format bounded implementation
        run: >-
          pnpm exec prettier --write
          apps/game
          docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md

      - name: Validate authentication-after-prologue boundary
        run: pnpm --filter @calypsos-promise/game validate:authentication-boundary

      - name: Validate permanent repository
        run: pnpm check

      - name: Validate browser, iOS, and Android export
        run: pnpm --filter @calypsos-promise/game build

      - name: Remove generated application state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Remove every temporary Sprint 10.7 file
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/temp-sprint-10-7-inspect.yml \
            .github/workflows/temp-sprint-10-7-implementation.yml \
            .github/workflows/temp-sprint-10-7-cleanup.yml \
            .github/workflows/temp-sprint-10-7-recovery.yml
          git rm -r -f --ignore-unmatch tools/temp-sprint-10-7
          rm -f tools/apply-sprint-10-7.py
          test -z "$(find .github/workflows tools -path '*temp-sprint-10-7*' -print)"

      - name: Commit and push race-safe durable implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md
          if ! git diff --cached --quiet; then
            git commit -s -m "feat: implement Sprint 10.7 authentication boundary"
          fi
          git fetch origin agent/sprint-10-1-application-toolchain
          git rebase origin/agent/sprint-10-1-application-toolchain
          git push origin HEAD:agent/sprint-10-1-application-toolchain
