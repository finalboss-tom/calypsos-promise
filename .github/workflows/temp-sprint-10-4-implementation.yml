name: Temporary Sprint 10.4 implementation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-4-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply bounded Sprint 10.4 implementation
        run: |
          cat tools/temp-sprint-10-4/chunk-* > /tmp/sprint-10-4.tar.gz
          echo "ce6bd2f3a3f99db14e020c4b3756f666df819bd6378ee18104a1a227d25e4e4d  /tmp/sprint-10-4.tar.gz" | sha256sum --check
          tar -xzf /tmp/sprint-10-4.tar.gz

      - name: Format Sprint 10.4 implementation
        run: >-
          pnpm exec prettier --write
          apps/game/README.md
          apps/game/package.json
          apps/game/app/(shell)/direct.tsx
          apps/game/app/(shell)/hearth.tsx
          apps/game/app/(shell)/play.tsx
          apps/game/src/components/DialogueChoices.tsx
          apps/game/src/components/QuestCard.tsx
          apps/game/src/components/SceneRenderer.tsx
          apps/game/src/components/WayfinderOrb.tsx
          apps/game/src/presentation/synthetic-presentation.ts
          apps/game/scripts/presentation-contract.mjs
          apps/game/scripts/validate-presentation.mjs
          apps/game/test/presentation.test.mjs
          docs/roadmap/sprint-10.4-scene-dialogue-quest-presentation.md

      - name: Validate presentation contract
        run: pnpm --filter @calypsos-promise/game validate:presentation

      - name: Run permanent repository validation
        run: pnpm check

      - name: Export browser, iOS, and Android bundles
        run: pnpm --filter @calypsos-promise/game build

      - name: Remove generated application state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Commit validated implementation
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game docs/roadmap/sprint-10.4-scene-dialogue-quest-presentation.md
          git commit -s -m "feat: implement Sprint 10.4 presentation"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
