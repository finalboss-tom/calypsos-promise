name: One-shot House of Keys formatter

on:
  push:
    branches:
      - sprint/5-threat-model-security

permissions:
  contents: write

concurrency:
  group: sprint-5-house-of-keys-formatter
  cancel-in-progress: false

jobs:
  format-and-remove-self:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sprint/5-threat-model-security
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format branch and remove one-shot workflow
        run: |
          pnpm format
          rm .github/workflows/format-sprint-5-house-of-keys.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply House of Keys formatting"
          git push origin HEAD:sprint/5-threat-model-security
