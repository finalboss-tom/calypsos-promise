name: Temporary Sprint 10.5 implementation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-5-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply bounded Sprint 10.5 implementation
        run: |
          cat tools/temp-sprint-10-5/archive-*.b64 | tr -d '\n' | base64 --decode > /tmp/sprint-10-5.tar.gz
          echo "cc8737b81a239f0349422ee34bdef128651b93ba88c2011cc106d77c4cbae14e  /tmp/sprint-10-5.tar.gz" | sha256sum --check
          tar -xzf /tmp/sprint-10-5.tar.gz

      - name: Format Sprint 10.5 implementation
        run: >-
          pnpm exec prettier --write
          apps/game
          docs/roadmap/sprint-10.5-state-and-authority-boundaries.md

      - name: Validate state and authority contract
        run: pnpm --filter @calypsos-promise/game validate:state-authority

      - name: Run permanent repository validation
        run: pnpm check

      - name: Export browser, iOS, and Android bundles
        run: pnpm --filter @calypsos-promise/game build

      - name: Remove generated application state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Commit validated implementation
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game docs/roadmap/sprint-10.5-state-and-authority-boundaries.md
          git commit -s -m "feat: implement Sprint 10.5 state authority"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
