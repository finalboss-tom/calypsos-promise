name: Format Sprint 8.4 records

on:
  push:
    branches:
      - agent/sprint-8-public-website-foundation
    paths:
      - .github/workflows/format-sprint-8-4-records.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sprint-8-public-website-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: rm .github/workflows/format-sprint-8-4-records.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: format Sprint 8.4 records"
          git push origin HEAD:agent/sprint-8-public-website-foundation
