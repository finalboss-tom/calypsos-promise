name: Sprint 3 validator repair

on:
  push:
    branches:
      - sprint/3-canonical-data-model-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sprint/3-canonical-data-model-v1
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair strict comparison guards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/health-schema/src/validate.ts")
          text = path.read_text()
          replacements = {
              "    if (compareTemporalText(exception.startsAt, exception.reviewAt) >= 0) {": "    const reviewOrder = compareTemporalText(exception.startsAt, exception.reviewAt);\n    if (reviewOrder !== undefined && reviewOrder >= 0) {",
              "      compareTemporalText(exception.startsAt, exception.endsAt) >= 0": "      (compareTemporalText(exception.startsAt, exception.endsAt) ?? -1) >= 0",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected validator text not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Apply repository formatting
        run: pnpm format

      - name: Validate health schema
        run: |
          pnpm --filter @calypsos-promise/health-schema typecheck
          pnpm --filter @calypsos-promise/health-schema test

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: format and compile Chronicle validators"
          git push origin HEAD:sprint/3-canonical-data-model-v1
