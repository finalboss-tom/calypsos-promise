name: Apply Sprint 7 status and formatting once

on:
  push:
    branches:
      - agent/sprint-7-forge-mcp

permissions:
  contents: write

jobs:
  apply-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-7-forge-mcp
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile Sprint 7 status
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new))

          replace(
              "README.md",
              "[Documentation](docs/README.md) · [Vision](VISION.md) · [Current status](docs/roadmap/current-status.md) · [Pre-Sprint 7 review](docs/roadmap/pre-sprint-7-alignment-review.md) · [Sprint 6 completion](docs/roadmap/sprint-6-completion-record.md)",
              "[Documentation](docs/README.md) · [Vision](VISION.md) · [Current status](docs/roadmap/current-status.md) · [Sprint 7 plan](docs/roadmap/sprint-7-execution-plan.md) · [Forge boundary](docs/architecture/forge-mcp-boundary-and-tool-registry.md) · [Pre-Sprint 7 review](docs/roadmap/pre-sprint-7-alignment-review.md) · [Sprint 6 completion](docs/roadmap/sprint-6-completion-record.md)",
          )
          replace(
              "README.md",
              "- **See what exists now:** [Current Project Status](docs/roadmap/current-status.md) → [Pre-Sprint 7 Alignment Review](docs/roadmap/pre-sprint-7-alignment-review.md) → [Sprint Roadmap](docs/roadmap/sprints.md)",
              "- **See what exists now:** [Current Project Status](docs/roadmap/current-status.md) → [Sprint 7 Execution Plan](docs/roadmap/sprint-7-execution-plan.md) → [Forge Boundary](docs/architecture/forge-mcp-boundary-and-tool-registry.md) → [Sprint Roadmap](docs/roadmap/sprints.md)",
          )
          replace(
              "README.md",
              "The [Pre-Sprint 7 Alignment Review](docs/roadmap/pre-sprint-7-alignment-review.md), tracked by issue #51, is the active gate. It confirms Sprint 7 remains aligned and defines a bounded Forge MCP handoff before implementation begins.\n\nAfter that reconciliation is accepted and merged, **Sprint 7 — Forge MCP and Agent Safety** becomes the next numbered sprint. Sprint 7 remains limited to local `stdio`, public documentation, synthetic data, allowlisted repository sources, deterministic validation, draft generation, and public-safe contributor tooling.",
              "The [Pre-Sprint 7 Alignment Review](docs/roadmap/pre-sprint-7-alignment-review.md) merged through PR #52 as squash commit `a41ca5ad9d2c0fe8a009946f376705bb7910e223`, establishing the bounded Forge MCP handoff.\n\n**Sprint 7 — Forge MCP and Agent Safety is active** through issue #54, branch `agent/sprint-7-forge-mcp`, and draft PR #55. Workstream 7.1 establishes the contract-only Forge application boundary, source classes, server-owned registry, risk classes, prohibited capabilities, validators, and public tests. Every tool remains planned and unexposed; no MCP transport or repository read exists yet.",
          )
