name: Sprint 5 status cleanup once

on:
  push:
    branches: [sprint/5-threat-model-security]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sprint/5-threat-model-security
          fetch-depth: 0
      - name: Clean completion navigation
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new))

          replace_once(
              "docs/README.md",
              "1. [Current Project Status](roadmap/current-status.md)\n2. [Sprint 5 Completion Record](roadmap/sprint-5-completion-record.md)\n3. [Security Architecture](security/README.md)\n4. [Sprint 5 Plan](roadmap/sprint-5-plan.md)\n4. [Pre-Sprint 5 Alignment Review](roadmap/pre-sprint-5-alignment-review.md)\n5. [Sprint 4 Completion Record](roadmap/sprint-4-completion-record.md)\n6. [Repository Reconciliation](repository-reconciliation-2026-07-24.md)\n7. [Sprint Roadmap](roadmap/sprints.md)\n8. [Repository and Module Boundaries](architecture/module-boundaries.md)\n9. [Minimum Viable Validation](policies/minimum-viable-validation.md)",
              "1. [Current Project Status](roadmap/current-status.md)\n2. [Sprint 5 Completion Record](roadmap/sprint-5-completion-record.md)\n3. [Security Architecture](security/README.md)\n4. [Sprint 5 Plan](roadmap/sprint-5-plan.md)\n5. [Pre-Sprint 5 Alignment Review](roadmap/pre-sprint-5-alignment-review.md)\n6. [Sprint 4 Completion Record](roadmap/sprint-4-completion-record.md)\n7. [Repository Reconciliation](repository-reconciliation-2026-07-24.md)\n8. [Sprint Roadmap](roadmap/sprints.md)\n9. [Repository and Module Boundaries](architecture/module-boundaries.md)\n10. [Minimum Viable Validation](policies/minimum-viable-validation.md)",
          )
          replace_once(
              "docs/README.md",
              "1. [Sprint 5 Completion Record](roadmap/sprint-5-completion-record.md)\n2. [Security Architecture](security/README.md)\n3. [Cross-Contract Reconciliation](security/sprint-5-cross-contract-reconciliation.md)\n4. [Specialist Holdpoint Register](security/sprint-5-specialist-holdpoint-and-evidence-register.md)\n5. [Sprint 5 Plan](roadmap/sprint-5-plan.md)\n6. [Control Status and Risk Vocabulary](security/control-status-and-risk-vocabulary.md)\n4. [Security Policy](../SECURITY.md)\n5. [Pre-Sprint 5 Alignment Review](roadmap/pre-sprint-5-alignment-review.md)\n6. [Architecture Foundation](frozen/architecture.md)\n7. [Repository and Module Boundaries](architecture/module-boundaries.md)\n8. [Publication and Confidentiality](policies/publication-and-confidentiality.md)\n9. [Institutional Immune System](governance/institutional-immune-system.md)",
              "1. [Sprint 5 Completion Record](roadmap/sprint-5-completion-record.md)\n2. [Security Architecture](security/README.md)\n3. [Cross-Contract Reconciliation](security/sprint-5-cross-contract-reconciliation.md)\n4. [Specialist Holdpoint Register](security/sprint-5-specialist-holdpoint-and-evidence-register.md)\n5. [Sprint 5 Plan](roadmap/sprint-5-plan.md)\n6. [Control Status and Risk Vocabulary](security/control-status-and-risk-vocabulary.md)\n7. [Security Policy](../SECURITY.md)\n8. [Pre-Sprint 5 Alignment Review](roadmap/pre-sprint-5-alignment-review.md)\n9. [Architecture Foundation](frozen/architecture.md)\n10. [Repository and Module Boundaries](architecture/module-boundaries.md)\n11. [Publication and Confidentiality](policies/publication-and-confidentiality.md)\n12. [Institutional Immune System](governance/institutional-immune-system.md)",
          )
          replace_once(
              "docs/roadmap/README.md",
              "1. [Current Project Status](current-status.md)\n2. [Sprint 5 Completion Record](sprint-5-completion-record.md)\n3. [Security Architecture](../security/README.md)\n4. [Sprint 5 Plan](sprint-5-plan.md)\n4. [Pre-Sprint 5 Alignment Review](pre-sprint-5-alignment-review.md)\n5. [Sprint 4 Completion Record](sprint-4-completion-record.md)\n6. [Sprint Sequence](sprints.md)\n7. [Public Institutional Roadmap](../../ROADMAP.md)",
              "1. [Current Project Status](current-status.md)\n2. [Sprint 5 Completion Record](sprint-5-completion-record.md)\n3. [Security Architecture](../security/README.md)\n4. [Sprint 5 Plan](sprint-5-plan.md)\n5. [Pre-Sprint 5 Alignment Review](pre-sprint-5-alignment-review.md)\n6. [Sprint 4 Completion Record](sprint-4-completion-record.md)\n7. [Sprint Sequence](sprints.md)\n8. [Public Institutional Roadmap](../../ROADMAP.md)",
          )
          replace_once(
              "README.md",
              "- Complete the Sprint 5 threat model, security, encryption, untrusted-input, lifecycle-enforcement, and receipt-integrity boundaries before production data paths.",
              "- Preserve the completed Sprint 5 threat, encryption, untrusted-input, lifecycle-enforcement, receipt-integrity, residual-risk, and specialist-holdpoint boundaries before any production data path.",
          )
          replace_once(
              "docs/roadmap/current-status.md",
              "[Documentation home](../README.md) · [Roadmap index](README.md) · [Institutional roadmap](../../ROADMAP.md) · [Sprint sequence](sprints.md) · [Sprint 5 plan](sprint-5-plan.md) · [Security architecture](../security/README.md)",
              "[Documentation home](../README.md) · [Roadmap index](README.md) · [Institutional roadmap](../../ROADMAP.md) · [Sprint sequence](sprints.md) · [Sprint 5 completion](sprint-5-completion-record.md) · [Sprint 5 plan](sprint-5-plan.md) · [Security architecture](../security/README.md)",
          )
          replace_once(
              "docs/roadmap/current-status.md",
              "Institutional Phase 0 remains active until its organizational and evidence gates are reviewed explicitly. Starting Sprint 5 does not declare the product runtime, security posture, clinical or legal review, research infrastructure, economics, governance transition, or Phase 0 complete.",
              "Institutional Phase 0 remains active until its organizational and evidence gates are reviewed explicitly. Completing Sprint 5 on the review branch does not declare the product runtime, deployed security posture, clinical or legal review, research infrastructure, economics, governance transition, or Phase 0 complete.",
          )
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup required."
            exit 0
          fi
          git config user.name "finalboss-tom"
          git config user.email "109227940+finalboss-tom@users.noreply.github.com"
          git add README.md docs/README.md docs/roadmap/README.md docs/roadmap/current-status.md
          git commit -m "docs: clean Sprint 5 completion navigation"
          git push origin HEAD:sprint/5-threat-model-security
