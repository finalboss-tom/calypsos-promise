name: One-time funding backlog reconciliation

on:
  push:
    branches:
      - institution/phase-0-funding-sponsorship-baseline

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: institution/phase-0-funding-sponsorship-baseline
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile future backlog and acceptance gates
        run: python .github/scripts/one-time-funding-backlog-reconciliation.py

      - name: Format reconciled records
        run: pnpm exec prettier --write docs/roadmap/sprints.md ROADMAP.md docs/economics/phase-0-funding-completion-record.md

      - name: Remove one-time helpers
        run: rm .github/workflows/one-time-funding-backlog-reconciliation.yml .github/scripts/one-time-funding-backlog-reconciliation.py

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/sprints.md ROADMAP.md docs/economics/phase-0-funding-completion-record.md .github/workflows/one-time-funding-backlog-reconciliation.yml .github/scripts/one-time-funding-backlog-reconciliation.py
          git commit -m "docs: reconcile funding baseline with future sprints"
          git push origin HEAD:institution/phase-0-funding-sponsorship-baseline
