name: Temporary Sprint 10.7 implementation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-7-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Validate and apply bounded Sprint 10.7 archive
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded = "".join(Path("tools/temp-sprint-10-7/archive.b64").read_text().split())
          payload = base64.b64decode(encoded, validate=True)
          print(f"archive_sha256={hashlib.sha256(payload).hexdigest()}")

          with gzip.GzipFile(fileobj=io.BytesIO(payload), mode="rb") as stream:
              tar_bytes = stream.read()

          allowed_document = "docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md"
          allowed_script = "tools/apply-sprint-10-7.py"

          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("archive is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsupported archive member type: {member.name}")
                  allowed = (
                      member.name == "apps"
                      or member.name == "apps/game"
                      or member.name.startswith("apps/game/")
                      or member.name == "docs"
                      or member.name == "docs/roadmap"
                      or member.name == allowed_document
                      or member.name == "tools"
                      or member.name == allowed_script
                  )
                  if not allowed:
                      raise SystemExit(f"unexpected archive member: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported archive member: {member.name}")
                  print(f"approved_member={member.name}")
              archive.extractall(path=Path.cwd(), filter="data")
          PY

          if [ -f tools/apply-sprint-10-7.py ]; then
            python tools/apply-sprint-10-7.py
            rm tools/apply-sprint-10-7.py
          fi

      - name: Format Sprint 10.7 implementation
        run: >-
          pnpm exec prettier --write
          apps/game
          docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md

      - name: Validate authentication-after-prologue boundary
        run: pnpm --filter @calypsos-promise/game validate:authentication-boundary

      - name: Run permanent repository validation
        run: pnpm check

      - name: Export browser, iOS, and Android bundles
        run: pnpm --filter @calypsos-promise/game build

      - name: Remove generated application state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Verify bounded working tree
        run: |
          python - <<'PY'
          import subprocess

          paths = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          allowed_doc = "docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md"
          for line in paths:
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              if not (path.startswith("apps/game/") or path == allowed_doc):
                  raise SystemExit(f"unexpected implementation mutation: {line}")
          if not paths:
              raise SystemExit("implementation produced no changes")
          print("\n".join(paths))
          PY

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md
          git commit -s -m "feat: implement Sprint 10.7 authentication boundary"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
