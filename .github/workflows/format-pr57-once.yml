name: Format PR 57 once

on:
  push:
    branches:
      - agent/phase-0-model-first-architecture-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-0-model-first-architecture-audit
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository formatting and remove this workflow
        run: |
          pnpm format
          rm .github/workflows/format-pr57-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ROADMAP.md .github/workflows/format-pr57-once.yml
          git diff --cached --quiet && exit 0
          git commit -s -m "style: apply repository formatting"
          git push
