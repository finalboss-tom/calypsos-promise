              "docs/roadmap/current-status.md",
              "## Institutional Phase 0 gate assessment",
              "## Next design-to-build boundary\n\nAfter Sprint 5 is approved and merged, Sprint 6 — Aster contracts and AI governance is next. Sprint 6 must inherit the Sprint 5 threats, controls, provider-egress, prompt-injection, retrieval, memory, non-AI fallback, evidence-status, and specialist-holdpoint boundaries rather than creating a parallel AI security model.\n\n## Institutional Phase 0 gate assessment",
          )

          replace_once(
              "docs/roadmap/sprint-5-plan.md",
              "**Status:** IN PROGRESS on issue #35  ",
              "**Status:** COMPLETE ON REVIEW BRANCH — pending explicit founding-steward approval and merge  ",
