name: Temporary Sprint 10.7 reconciliation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-7-reconcile.yml

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Identify clean implementation checkpoint
        run: |
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp-sprint-10-7-reconcile.yml"
          echo "CLEAN_HEAD=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - name: Require successful normal CI and DCO on clean checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["CLEAN_HEAD"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/actions/runs?head_sha={head}&per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          required = {"CI": None, "DCO Attestation": None}
          for _ in range(40):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response)["workflow_runs"]
              for name in required:
                  candidates = [run for run in runs if run["name"] == name]
                  if candidates:
                      required[name] = max(candidates, key=lambda run: run["id"])
              if all(
                  run
                  and run["status"] == "completed"
                  and run["conclusion"] == "success"
                  for run in required.values()
              ):
                  break
              time.sleep(15)
          else:
              summary = {
                  name: None
                  if run is None
                  else {
                      "status": run["status"],
                      "conclusion": run["conclusion"],
                      "run_number": run["run_number"],
                  }
                  for name, run in required.items()
              }
              raise SystemExit(f"clean checkpoint CI/DCO did not become successful: {summary}")

          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"CLEAN_CI={required['CI']['run_number']}\n")
              environment.write(
                  f"CLEAN_DCO={required['DCO Attestation']['run_number']}\n"
              )
          print(
              f"clean checkpoint {head}: CI {required['CI']['run_number']} / "
              f"DCO {required['DCO Attestation']['run_number']}"
          )
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reconcile Sprint 10.7 status and executable policy
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          clean_head = os.environ["CLEAN_HEAD"]
          clean_ci = os.environ["CLEAN_CI"]
          clean_dco = os.environ["CLEAN_DCO"]

          record_path = Path(
              "docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md"
          )
          status_path = Path("docs/roadmap/current-status.md")
          policy_path = Path("tools/policy/check-longitudinal-intelligence.mjs")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          record = record_path.read_text()
          record = replace_once(
              record,
              "**Status:** IMPLEMENTED — PENDING EXACT CHECKPOINT VALIDATION",
              "**Status:** COMPLETE AND VALIDATED WITHIN ACTIVE SPRINT 10",
              "10.7 status",
          )
          boundary_sentence = (
              "The authentication-after-prologue boundary is informational only. "
              "The default is to discard temporary or synthetic state; no production "
              "identity provider is selected, and no silent state transfer is permitted."
          )
          if boundary_sentence not in record:
              record = replace_once(
                  record,
                  "## Holdpoints preserved",
                  f"{boundary_sentence}\n\n## Holdpoints preserved",
                  "10.7 explicit boundary",
              )

          validation = f"""## Validated checkpoint

Exact clean implementation checkpoint: `{clean_head}`

- CI {clean_ci}: success
- DCO {clean_dco}: success
- frozen Node 24 / pnpm 10.13.1 installation: success
- focused authentication-after-prologue contract and tests: success
- no-account public completion, post-prologue-only offer, informational future account value, discard-by-default, no-silent-transfer, and complete future-handoff requirement tests: success
- production identity-provider, credential, token, account-session, protected-data, permission, analytics, and provider-SDK absence checks: success
- formatting, documentation, repository policy, Longitudinal Intelligence coherence, content validation, economics, lint, typecheck, and tests: success
- existing production-site build and rendered prologue validation: success
- browser, iOS, and Android credential-free Expo export: success
- generated-state cleanup and no tracked build mutation: success
- temporary implementation tooling: removed before clean checkpoint validation

This is maintainer implementation and CI evidence inside active Sprint 10. It is not production authentication, identity-provider selection, account or session security readiness, private-data or Chronicle readiness, independent accessibility/security/privacy/legal/affected-user certification, deployment or distribution authorization, authority to begin Sprint 11, activation of LI-V1 through LI-V8, or institutional Phase 0 exit.

## Sprint-level gate"""
          record, substitutions = re.subn(
              r"## Validation target\n.*?\n## Sprint-level gate",
              validation,
              record,
              count=1,
              flags=re.S,
          )
          if substitutions != 1:
              raise SystemExit(
                  f"10.7 validation section: expected one match, found {substitutions}"
              )
          record_path.write_text(record)

          status = status_path.read_text()
          if "sprint-10.7-authentication-after-prologue-boundary.md" not in status:
              status = replace_once(
                  status,
                  "[Sprint 10.6 offline and resilience](sprint-10.6-offline-resilience-behavior.md) · [Sprint 9 completion]",
                  "[Sprint 10.6 offline and resilience](sprint-10.6-offline-resilience-behavior.md) · [Sprint 10.7 authentication boundary](sprint-10.7-authentication-after-prologue-boundary.md) · [Sprint 9 completion]",
                  "current-status navigation",
              )
          status = replace_once(
              status,
              "**Sprint 10.1 through Sprint 10.6 are complete as validated internal checkpoints.**",
              "**Sprint 10.1 through Sprint 10.7 are complete as validated internal checkpoints.**",
              "current-status summary completion",
          )
          checkpoint_line = (
              f"- **Sprint 10.7 checkpoint:** `{clean_head}` — CI {clean_ci} / DCO {clean_dco}."
          )
          if checkpoint_line not in status:
              match = re.search(r"^- \*\*Sprint 10\.6 checkpoint:\*\*.*$", status, re.M)
              if not match:
                  raise SystemExit("current-status 10.6 checkpoint anchor missing")
              status = status[: match.end()] + "\n" + checkpoint_line + status[match.end() :]
          status = replace_once(
              status,
              "**Sprint 10.7 through Sprint 10.10:** not started.",
              "**Sprint 10.8 through Sprint 10.10:** not started.",
              "current-status remaining workstreams",
          )
          status = replace_once(
              status,
              "Workstreams 10.1 through 10.6 are complete as validated internal checkpoints; no later workstream, provider choice, deployment, indexing change, store submission, or Sprint 11 work has begun.",
              "Workstreams 10.1 through 10.7 are complete as validated internal checkpoints; no later workstream, provider choice, deployment, indexing change, store submission, or Sprint 11 work has begun.",
              "current-status accepted authorization",
          )

          section = f"""## Sprint 10.7 validated checkpoint

Workstream 10.7 establishes the authentication-after-prologue boundary as information and executable non-transfer rules only:

- the public synthetic experience remains completable without an account;
- account value is described only after the public presentation boundary and remains explicitly future and inactive;
- Sprint 10 selects no production identity provider and implements no sign-in, account, credential, token, recovery, or session runtime;
- temporary and synthetic state is discarded by default;
- no public presentation state transfers silently;
- any future transfer candidate requires explicit disclosure, review, player confirmation, provenance, purpose, correction, and deletion behavior;
- authentication cannot convert dialogue choices, temporary preferences, presentation completion, First Lantern framing, Aster framing, stored state, or offline records into Chronicle evidence, permission, progress, health truth, authentic preference, or Longitudinal Intelligence; and
- account creation, recovery, support, abuse handling, deletion, incidents, and production accessibility/security operations remain later separately authorized work.

The validated clean checkpoint is `{clean_head}` with CI {clean_ci} and DCO {clean_dco}. This is maintainer implementation and CI evidence inside the active Sprint 10 PR. It is not production authentication, private-data readiness, provider selection, deployment, mobile distribution, independent specialist certification, Sprint 11 authorization, a later Longitudinal Intelligence stage, or institutional Phase 0 exit.

"""
          if "## Sprint 10.7 validated checkpoint" not in status:
              status = replace_once(
                  status,
                  "## Sprint 10 pull-request model",
                  section + "## Sprint 10 pull-request model",
                  "current-status 10.7 section",
              )
          status = replace_once(
              status,
              "Sprint 10.1 through Sprint 10.6 are complete as validated internal checkpoints. PR #79 remains draft for workstreams 10.1 through 10.10.",
              "Sprint 10.1 through Sprint 10.7 are complete as validated internal checkpoints. PR #79 remains draft for workstreams 10.1 through 10.10.",
              "current-status next-decision completion",
          )
          status = replace_once(
              status,
              "The next implementation step is Sprint 10.7 on the same branch and PR. No separate founding-steward acceptance or merge occurs for Sprint 10.1 through Sprint 10.6.",
              "The next implementation step is Sprint 10.8 on the same branch and PR. No separate founding-steward acceptance or merge occurs for Sprint 10.1 through Sprint 10.7.",
              "current-status next implementation",
          )
          status = replace_once(
              status,
              "Sprint 10.7 through Sprint 10.10 remain unstarted until entered in sequence;",
              "Sprint 10.8 through Sprint 10.10 remain unstarted until entered in sequence;",
              "current-status remaining gate",
          )
          status_path.write_text(status)

          policy = policy_path.read_text()
          if "const sprintTenSevenPath" not in policy:
              policy = replace_once(
                  policy,
                  'const sprintTenSixPath =\n  "docs/roadmap/sprint-10.6-offline-resilience-behavior.md";',
                  'const sprintTenSixPath =\n  "docs/roadmap/sprint-10.6-offline-resilience-behavior.md";\nconst sprintTenSevenPath =\n  "docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md";',
                  "LI policy 10.7 path",
              )
              policy = replace_once(
                  policy,
                  "const sprintTenSix = await loadText(sprintTenSixPath);",
                  "const sprintTenSix = await loadText(sprintTenSixPath);\nconst sprintTenSeven = await loadText(sprintTenSevenPath);",
                  "LI policy 10.7 load",
              )
              tuple_anchor = "  [\n    currentStatusPath,"
              tuple = '''  [
    sprintTenSevenPath,
    sprintTenSeven,
    [
      "COMPLETE AND VALIDATED WITHIN ACTIVE SPRINT 10",
      "issue #80",
      "draft PR #79",
      "apps/game",
      "authentication-after-prologue boundary",
      "default is to discard temporary or synthetic state",
      "no production identity provider is selected",
      "no silent state transfer is permitted",
      "Sprint 10.8",
      "no separate founding-steward acceptance or merge gate",
    ],
  ],
'''
              policy = replace_once(
                  policy,
                  tuple_anchor,
                  tuple + tuple_anchor,
                  "LI policy 10.7 requirements",
              )
          policy = policy.replace(
              '"Sprint 10.1 through Sprint 10.6 are complete as validated internal checkpoints"',
              '"Sprint 10.1 through Sprint 10.7 are complete as validated internal checkpoints"',
          )
          policy = policy.replace(
              '"Sprint 10.7 through Sprint 10.10"',
              '"Sprint 10.8 through Sprint 10.10"',
          )
          policy_path.write_text(policy)
          PY

      - name: Format reconciled records
        run: >-
          pnpm exec prettier --write
          docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md
          docs/roadmap/current-status.md
          tools/policy/check-longitudinal-intelligence.mjs

      - name: Validate reconciled repository
        run: pnpm check

      - name: Remove reconciliation workflow
        run: |
          git rm .github/workflows/temp-sprint-10-7-reconcile.yml
          test -z "$(find .github/workflows tools -path '*temp-sprint-10-7*' -print)"

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md \
            docs/roadmap/current-status.md \
            tools/policy/check-longitudinal-intelligence.mjs
          git commit -s -m "docs: reconcile Sprint 10.7 checkpoint"
          git fetch origin agent/sprint-10-1-application-toolchain
          git rebase origin/agent/sprint-10-1-application-toolchain
          git push origin HEAD:agent/sprint-10-1-application-toolchain
