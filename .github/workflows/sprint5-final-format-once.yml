name: Sprint 5 final format once

on:
  push:
    branches: [sprint/5-threat-model-security]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sprint/5-threat-model-security
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm format
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "finalboss-tom"
          git config user.email "109227940+finalboss-tom@users.noreply.github.com"
          git add -u
          git commit -m "style: format Sprint 5 completion records"
          git push origin HEAD:sprint/5-threat-model-security
