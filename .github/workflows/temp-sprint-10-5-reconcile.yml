name: Temporary Sprint 10.5 reconciliation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-5-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reconcile Sprint 10.5 status and policy
        run: python tools/temp-sprint-10-5-reconcile.py

      - name: Make client-authority prohibition explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/sprint-10.5-state-and-authority-boundaries.md")
          source = path.read_text()
          marker = "\n\n## Implemented boundary"
          replacement = (
              "\n\nThere is no client-authoritative completion or rewards. "
              "Every client claim remains presentation evidence only and fails closed."
              "\n\n## Implemented boundary"
          )
          if source.count(marker) != 1:
              raise SystemExit("expected one implemented-boundary marker")
          path.write_text(source.replace(marker, replacement, 1))
          PY

      - name: Format reconciled records
        run: >-
          pnpm exec prettier --write
          docs/roadmap/sprint-10.5-state-and-authority-boundaries.md
          docs/roadmap/current-status.md
          tools/policy/check-longitudinal-intelligence.mjs

      - name: Validate reconciled repository
        run: pnpm check

      - name: Commit reconciliation
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/sprint-10.5-state-and-authority-boundaries.md docs/roadmap/current-status.md tools/policy/check-longitudinal-intelligence.mjs
          git commit -s -m "docs: reconcile Sprint 10.5 checkpoint"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
