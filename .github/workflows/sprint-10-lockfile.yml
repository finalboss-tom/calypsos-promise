name: Sprint 10 lockfile generation

on:
  pull_request:
    paths:
      - apps/game/package.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/sprint-10-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Generate lockfile and capture resolver output
        id: generate
        shell: bash
        run: |
          set +e
          pnpm install --lockfile-only --no-frozen-lockfile > lockfile-generation.log 2>&1
          status=$?
          cat lockfile-generation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lockfile and resolver evidence
        uses: actions/upload-artifact@v7
        with:
          name: sprint-10-lockfile-evidence
          path: |
            pnpm-lock.yaml
            lockfile-generation.log
          if-no-files-found: error
      - name: Commit generated lockfile to the pull-request branch
        if: steps.generate.outputs.status == '0'
        shell: bash
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Sprint 10 lockfile' -m 'Signed-off-by: Tom <109227940+finalboss-tom@users.noreply.github.com>'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Fail when lockfile generation did not succeed
        if: steps.generate.outputs.status != '0'
        run: exit 1
