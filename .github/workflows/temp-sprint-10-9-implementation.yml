name: Temporary Sprint 10.9 implementation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-9-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply bounded Sprint 10.9 implementation
        run: python tools/temp-sprint-10-9-apply.py

      - name: Reconcile permanent CI anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/ci.yml")
          source = path.read_text()
          start_marker = "      - name: Validate application and toolchain boundary"
          end_marker = "      - name: Remove generated application state"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = "\n".join([
              "      - name: Validate application and toolchain boundary",
              "        run: pnpm --filter @calypsos-promise/game validate:toolchain",
              "      - name: Validate build, release, rollback, and operations evidence",
              "        run: pnpm --filter @calypsos-promise/game validate:operations",
              "      - name: Export browser, iOS, and Android bundles without credentials",
              "        run: pnpm --filter @calypsos-promise/game build",
              "      - name: Write deterministic unsigned build evidence",
              "        run: pnpm --filter @calypsos-promise/game build:evidence -- --source \"$GITHUB_SHA\"",
              "      - name: Validate deterministic unsigned build evidence",
              "        run: |",
              "          test -f apps/game/dist/build-evidence.json",
              "          pnpm --filter @calypsos-promise/game validate:build-evidence -- --path dist/build-evidence.json --source \"$GITHUB_SHA\"",
              "",
          ])
          path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Reconcile operations declaration types
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("apps/game/src/operations/build-release-operations.d.mts").write_text('''export type OperationsPlatform = "web" | "ios" | "android";

export interface BuildArtifactEvidence {
  path: string;
  sha256: string;
  bytes: number;
}

export interface BuildInputs {
  node: string;
  packageManager: string;
  expo: string;
  expoRouter: string;
  reactNative: string;
  react: string;
  gameContent: string;
  platforms: readonly OperationsPlatform[];
  command: string;
}

export interface UnsignedBuildEvidence {
  schemaVersion: string;
  operationsContractVersion: string;
  evidenceClass: "repository-ci-unsigned-export";
  informationClass: "PUBLIC_SYNTHETIC";
  sourceRevision: string;
  lockfileSha256: string;
  inputs: Readonly<BuildInputs>;
  artifacts: readonly BuildArtifactEvidence[];
  signed: false;
  credentialsUsed: false;
  releaseAuthorized: false;
  distributionAuthorized: false;
  authority: string;
}

export interface HostedPreviewDecision {
  state: "not-authorized" | "record-complete";
  authorization: boolean;
  sourceRevision: string | null;
  providerProject: string;
  accessState: string;
  indexingDiscovery: string;
  configurationSecrets: string;
  runtimeLimitations: readonly string[];
  dataClasses: readonly "PUBLIC_SYNTHETIC"[];
  monitoringIncidentOwnership: string;
  expiryTeardown: string;
  rollback: string;
}

export interface ProviderAdapter {
  id: string;
  capability: string;
  currentUse: string;
  replacement: string;
  manualFallback: string;
  authority: false;
}

export interface IncidentContract {
  currentScope: string;
  activeOwner: string;
  releaseOwner: string;
  coveredClasses: readonly string[];
  requiredActions: readonly string[];
  outOfScopeUntilCapabilityExists: readonly string[];
}

export interface RollbackScenario {
  id: string;
  activeNow: boolean;
  trigger: string;
  actions: readonly string[];
}

export interface GeneratedStatePolicy {
  generatedPaths: readonly string[];
  tracked: false;
  cleanAfterValidation: true;
  nativeProjectsGenerated: false;
  evidenceLocation: string;
  rule: string;
}

export interface SigningDistributionBoundary {
  easConfigured: false;
  appleSigningConfigured: false;
  googleSigningConfigured: false;
  storeCredentialsPresent: false;
  updateChannelConfigured: false;
  repositorySecretsRequiredForBuildEvidence: false;
  unsignedExportIsReleaseArtifact: false;
  distributionAuthority: false;
  rule: string;
}

export const OPERATIONS_CONTRACT_VERSION: string;
export const BUILD_EVIDENCE_SCHEMA_VERSION: string;
export const BUILD_INPUTS: Readonly<BuildInputs>;
export const RELEASE_GATES: Readonly<Record<string, false>>;
export const HOSTED_PREVIEW_DECISION_FIELDS: readonly string[];
export const CURRENT_HOSTED_PREVIEW_DECISION: Readonly<HostedPreviewDecision>;
export const SIGNING_DISTRIBUTION_BOUNDARY: Readonly<SigningDistributionBoundary>;
export const PROVIDER_ADAPTERS: readonly Readonly<ProviderAdapter>[];
export const PUBLIC_SYNTHETIC_INCIDENT_CONTRACT: Readonly<IncidentContract>;
export const ROLLBACK_SCENARIOS: readonly Readonly<RollbackScenario>[];
export const GENERATED_STATE_POLICY: Readonly<GeneratedStatePolicy>;
export const RESIDUAL_OPERATIONS_LIMITATIONS: readonly string[];

export function validateHostedPreviewDecision(
  decision: HostedPreviewDecision | Record<string, unknown>,
): { ok: boolean; authorizesPreview: false; reason?: string };
export function createUnsignedBuildEvidence(input: {
  sourceRevision: string;
  lockfileSha256: string;
  files: readonly BuildArtifactEvidence[];
}): UnsignedBuildEvidence;
export function validateBuildEvidence(
  evidence: UnsignedBuildEvidence | Record<string, unknown>,
  expectedSourceRevision?: string,
): { ok: boolean; releaseAuthorized: false; reason?: string };
export function validateOperationsContract(): {
  ok: boolean;
  releaseAuthorized: false;
  previewAuthorized: false;
};
export function evaluateReleaseAuthority(): Readonly<{
  authorized: false;
  reason: string;
}>;
''')
          PY

      - name: Format implementation
        run: >-
          pnpm exec prettier --write
          .github/workflows/ci.yml
          apps/game
          docs/roadmap/sprint-10.9-build-release-rollback-operations-evidence.md
          package.json

      - name: Run focused operations validation
        run: pnpm --filter @calypsos-promise/game validate:operations

      - name: Run complete permanent repository suite
        run: pnpm check

      - name: Export browser, iOS, and Android bundles without credentials
        run: pnpm --filter @calypsos-promise/game build

      - name: Write and validate unsigned build evidence
        run: |
          SOURCE_REVISION="$(git rev-parse HEAD)"
          pnpm --filter @calypsos-promise/game build:evidence -- --source "$SOURCE_REVISION"
          test -f apps/game/dist/build-evidence.json
          pnpm --filter @calypsos-promise/game validate:build-evidence -- --path dist/build-evidence.json --source "$SOURCE_REVISION"

      - name: Remove generated application state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Verify generated state is absent
        run: |
          test ! -e apps/game/dist
          test ! -e apps/game/.expo
          test ! -e apps/game/android
          test ! -e apps/game/ios

      - name: Remove temporary implementation transport
        run: |
          rm -f tools/temp-sprint-10-9-apply.py
          rm -f .github/workflows/temp-sprint-10-9-implementation.yml
          test ! -e tools/temp-sprint-10-9-apply.py
          test ! -e .github/workflows/temp-sprint-10-9-implementation.yml

      - name: Commit durable implementation
        run: |
          git config user.name "Tom"
          git config user.email "109227940+finalboss-tom@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement Sprint 10.9 operations evidence" -m "Signed-off-by: Tom <109227940+finalboss-tom@users.noreply.github.com>"
          git pull --rebase origin agent/sprint-10-1-application-toolchain
          git push origin HEAD:agent/sprint-10-1-application-toolchain
