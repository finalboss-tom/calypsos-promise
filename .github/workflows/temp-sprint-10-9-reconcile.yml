name: Temporary Sprint 10.9 reconciliation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-9-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reconcile Sprint 10.9 records
        run: python tools/temp-sprint-10-9-reconcile.py

      - name: Format reconciled records
        run: >-
          pnpm exec prettier --write
          docs/roadmap/sprint-10.9-build-release-rollback-operations-evidence.md
          docs/roadmap/current-status.md
          tools/policy/check-longitudinal-intelligence.mjs

      - name: Validate reconciled repository
        run: pnpm check

      - name: Prepare durable reconciliation commit
        run: |
          rm -f tools/temp-sprint-10-9-reconcile.py
          git restore .github/workflows/temp-sprint-10-9-reconcile.yml
          test ! -e tools/temp-sprint-10-9-reconcile.py
          git diff -- .github/workflows/temp-sprint-10-9-reconcile.yml --exit-code

      - name: Commit and push reconciled records
        run: |
          git config user.name "Tom"
          git config user.email "109227940+finalboss-tom@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile Sprint 10.9 checkpoint" -m "Signed-off-by: Tom <109227940+finalboss-tom@users.noreply.github.com>"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
