name: DCO Attestation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Require DCO attestation in pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_NUMBER" = "3" ] && [ "$PR_AUTHOR" = "finalboss-tom" ]; then
            echo 'Bootstrap exception: PR #3 predates DCO automation. Future pull requests require attestation.'
            exit 0
          fi
          if ! printf '%s' "$PR_BODY" | grep -Eiq -- '- \[[xX]\] Every commit includes a `Signed-off-by` line'; then
            echo 'DCO attestation is missing. Check the DCO box in the pull request template after signing commits.'
            exit 1
          fi
          echo 'DCO attestation recorded.'

# Transitional control: replace with a commit-level DCO app/check before accepting
# external contributions. PR #3 is the one-time repository-bootstrap exception.
