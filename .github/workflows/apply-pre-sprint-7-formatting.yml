name: Apply pre-Sprint 7 formatting once

on:
  push:
    branches:
      - agent/pre-sprint-7-reconciliation

permissions:
  contents: write

jobs:
  apply-formatting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/pre-sprint-7-reconciliation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: pnpm format

      - name: Remove one-run workflow and commit formatter output
        shell: bash
        run: |
          git rm .github/workflows/apply-pre-sprint-7-formatting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: apply pre-Sprint 7 formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
