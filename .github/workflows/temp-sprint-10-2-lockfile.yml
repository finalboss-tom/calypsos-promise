name: Temporary Sprint 10.2 lock refresh

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-2-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh frozen workspace lock
        run: pnpm install --no-frozen-lockfile

      - name: Format Sprint 10.2 files and lock
        run: >-
          pnpm exec prettier --write
          package.json
          apps/game/package.json
          packages/game-content/package.json
          packages/game-content/tsconfig.json
          packages/game-content/README.md
          packages/game-content/src/index.ts
          packages/game-content/src/validate.ts
          packages/game-content/scripts/validate-package.mjs
          packages/game-content/test/game-content.test.mjs
          docs/roadmap/sprint-10.2-versioned-game-content-package.md
          pnpm-lock.yaml

      - name: Run permanent repository validation
        run: pnpm check

      - name: Validate game toolchain boundary
        run: pnpm game:validate

      - name: Export browser, iOS, and Android bundles
        run: pnpm --filter @calypsos-promise/game build

      - name: Remove generated game state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Verify and commit lock refresh
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/game/package.json packages/game-content docs/roadmap/sprint-10.2-versioned-game-content-package.md pnpm-lock.yaml
          git commit -s -m "feat: complete Sprint 10.2 package integration"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
