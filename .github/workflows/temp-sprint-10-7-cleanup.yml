name: Temporary Sprint 10.7 durable cleanup

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-7-cleanup.yml

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Wait for the validated 10.7 product commit
        run: |
          branch=agent/sprint-10-1-application-toolchain
          found=false
          for attempt in $(seq 1 40); do
            git fetch origin "$branch"
            if git cat-file -e "origin/$branch:docs/roadmap/sprint-10.7-authentication-after-prologue-boundary.md" 2>/dev/null \
              && git cat-file -e "origin/$branch:apps/game/scripts/validate-authentication-boundary.mjs" 2>/dev/null; then
              git reset --hard "origin/$branch"
              found=true
              break
            fi
            sleep 15
          done
          if [ "$found" != true ]; then
            echo "The validated Sprint 10.7 implementation commit did not appear." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Revalidate authentication boundary
        run: pnpm --filter @calypsos-promise/game validate:authentication-boundary

      - name: Revalidate permanent repository
        run: pnpm check

      - name: Revalidate browser, iOS, and Android export
        run: pnpm --filter @calypsos-promise/game build

      - name: Remove generated application state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Remove all temporary Sprint 10.7 transport
        run: |
          git rm -f \
            .github/workflows/temp-sprint-10-7-inspect.yml \
            .github/workflows/temp-sprint-10-7-implementation.yml \
            .github/workflows/temp-sprint-10-7-cleanup.yml
          git rm -r -f tools/temp-sprint-10-7
          test -z "$(find .github/workflows tools -path '*temp-sprint-10-7*' -print)"

      - name: Verify durable-only working tree
        run: |
          git status --short
          test -z "$(git status --short | grep -vE '^D  (\.github/workflows/temp-sprint-10-7-(inspect|implementation|cleanup)\.yml|tools/temp-sprint-10-7/archive\.b64)$')"

      - name: Commit durable cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "chore: remove Sprint 10.7 temporary tooling"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
