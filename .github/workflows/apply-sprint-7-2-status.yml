name: Apply Sprint 7.2 status once

on:
  push:
    branches:
      - agent/sprint-7-forge-mcp

permissions:
  contents: write

jobs:
  apply-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sprint-7-forge-mcp
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile Sprint 7.2 status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "[Forge boundary](docs/architecture/forge-mcp-boundary-and-tool-registry.md) · [Pre-Sprint 7 review]",
              "[Forge boundary](docs/architecture/forge-mcp-boundary-and-tool-registry.md) · [Local transport](docs/architecture/forge-mcp-local-stdio-transport.md) · [Pre-Sprint 7 review]",
          )
          replace_once(
              "README.md",
              "[Forge Boundary](docs/architecture/forge-mcp-boundary-and-tool-registry.md) → [Sprint Roadmap]",
              "[Forge Boundary](docs/architecture/forge-mcp-boundary-and-tool-registry.md) → [Local Transport](docs/architecture/forge-mcp-local-stdio-transport.md) → [Sprint Roadmap]",
          )
          replace_once(
              "README.md",
              "**Sprint 7 — Forge MCP and Agent Safety is active** through issue #54, branch `agent/sprint-7-forge-mcp`, and draft PR #55. Workstream 7.1 establishes the contract-only Forge application boundary, source classes, server-owned registry, risk classes, prohibited capabilities, validators, and public tests. Every tool remains planned and unexposed; no MCP transport or repository read exists yet.",
              "**Sprint 7 — Forge MCP and Agent Safety is active** through issue #54, branch `agent/sprint-7-forge-mcp`, and draft PR #55. Workstreams 7.1 and 7.2 establish the Forge boundary, registry, finalized-version local `stdio` transport, direct harness, cancellation, shutdown, framing, and transport-safe errors. Every tool remains planned and unexposed; no repository read exists yet. Sprint 7.3 — source catalogue and provenance is next.",
          )
          replace_once(
              "README.md",
              "- Complete Sprint 7.1 on draft PR #55 with full repository validation before enabling any tool or transport.",
              "- Begin Sprint 7.3 on draft PR #55 by defining server-owned repository roots, source allowlists, prohibited paths, traversal and symlink isolation, digests, locators, truncation, and partial results before any tool reads repository content.",
          )

          replace_once(
              "docs/README.md",
              "[Forge boundary](architecture/forge-mcp-boundary-and-tool-registry.md) · [Pre-Sprint 7 review]",
              "[Forge boundary](architecture/forge-mcp-boundary-and-tool-registry.md) · [Local transport](architecture/forge-mcp-local-stdio-transport.md) · [Pre-Sprint 7 review]",
          )
          replace_once(
              "docs/README.md",
              "3. [Forge MCP Boundary and Tool Registry](architecture/forge-mcp-boundary-and-tool-registry.md)\n4. [Pre-Sprint 7 Repository Alignment Review]",
              "3. [Forge MCP Boundary and Tool Registry](architecture/forge-mcp-boundary-and-tool-registry.md)\n4. [Forge MCP Local `stdio` Transport](architecture/forge-mcp-local-stdio-transport.md)\n5. [Pre-Sprint 7 Repository Alignment Review]",
          )
          replace_once(
              "docs/README.md",
              "Sprint 7 — Forge MCP and Agent Safety is active through issue #54 and draft PR #55. The [Sprint 7 Execution Plan](roadmap/sprint-7-execution-plan.md) and [Forge Boundary](architecture/forge-mcp-boundary-and-tool-registry.md) govern the contract-only 7.1 baseline. All tools remain planned and unexposed; no transport or repository read exists yet.",
              "Sprint 7 — Forge MCP and Agent Safety is active through issue #54 and draft PR #55. The [Sprint 7 Execution Plan](roadmap/sprint-7-execution-plan.md), [Forge Boundary](architecture/forge-mcp-boundary-and-tool-registry.md), and [Local Transport](architecture/forge-mcp-local-stdio-transport.md) govern the validated 7.1 and 7.2 baselines. A finalized-version local `stdio` transport exists, but all tools remain planned and unexposed and no repository read exists yet. Sprint 7.3 is next.",
          )

          replace_once(
              "docs/architecture/README.md",
              "[Forge boundary](forge-mcp-boundary-and-tool-registry.md) · [Sprint 7 plan]",
              "[Forge boundary](forge-mcp-boundary-and-tool-registry.md) · [Local transport](forge-mcp-local-stdio-transport.md) · [Sprint 7 plan]",
          )
          replace_once(
              "docs/architecture/README.md",
              "32. [Forge MCP Boundary and Tool Registry](forge-mcp-boundary-and-tool-registry.md)\n33. [Pre-Sprint 7 Repository Alignment Review]",
              "32. [Forge MCP Boundary and Tool Registry](forge-mcp-boundary-and-tool-registry.md)\n33. [Forge MCP Local `stdio` Transport](forge-mcp-local-stdio-transport.md)\n34. [Pre-Sprint 7 Repository Alignment Review]",
          )
          replace_once(
              "docs/architecture/README.md",
              "- [Forge MCP Boundary and Tool Registry](forge-mcp-boundary-and-tool-registry.md)\n- [Sprint 7 Execution Plan]",
              "- [Forge MCP Boundary and Tool Registry](forge-mcp-boundary-and-tool-registry.md)\n- [Forge MCP Local `stdio` Transport](forge-mcp-local-stdio-transport.md)\n- [Sprint 7 Execution Plan]",
          )
          replace_once(
              "docs/architecture/README.md",
              "Sprint 7 is active on issue #54 and draft PR #55. Workstream 7.1 defines the application boundary, public source classes, server-owned registry, risk classes, planned tool contracts, prohibited capabilities, compatibility and migration references, resource-limit contracts, literal non-authority, funding neutrality, validators, and public tests.\n\nEvery initial tool remains planned and unexposed. No MCP transport or repository read is implemented yet.",
              "Sprint 7 is active on issue #54 and draft PR #55. Workstreams 7.1 and 7.2 define the application boundary, public source classes, server-owned registry, risk classes, planned tool contracts, prohibited capabilities, finalized-version local `stdio` transport, direct harness, cancellation, shutdown, framing, public-safe errors, compatibility references, literal non-authority, funding neutrality, validators, and public tests.\n\nEvery initial tool remains planned and unexposed. The local transport is implemented, but no repository read is implemented yet. Sprint 7.3 owns source catalogues and provenance.",
          )

          replace_once(
              "docs/roadmap/README.md",
              "[Forge boundary](../architecture/forge-mcp-boundary-and-tool-registry.md) · [Pre-Sprint 7 review]",
              "[Forge boundary](../architecture/forge-mcp-boundary-and-tool-registry.md) · [Local transport](../architecture/forge-mcp-local-stdio-transport.md) · [Pre-Sprint 7 review]",
          )
          replace_once(
              "docs/roadmap/README.md",
              "3. [Forge MCP Boundary and Tool Registry](../architecture/forge-mcp-boundary-and-tool-registry.md)\n4. [Pre-Sprint 7 Alignment Review]",
              "3. [Forge MCP Boundary and Tool Registry](../architecture/forge-mcp-boundary-and-tool-registry.md)\n4. [Forge MCP Local `stdio` Transport](../architecture/forge-mcp-local-stdio-transport.md)\n5. [Pre-Sprint 7 Alignment Review]",
          )
          replace_once(
              "docs/roadmap/README.md",
              "Sprint 7 — Forge MCP and Agent Safety is active through issue #54 and draft PR #55. Workstream 7.1 defines the contract-only local application boundary, public source classes, server-owned registry, risk classes, planned tools, prohibited capabilities, validators, and public tests. It does not activate transport, repository reads, private Chronicle MCP, production agents, credentials, connectors, providers, or consequential actions.",
              "Sprint 7 — Forge MCP and Agent Safety is active through issue #54 and draft PR #55. Workstreams 7.1 and 7.2 define the bounded application, public source classes, server-owned registry, risk classes, planned tools, prohibited capabilities, finalized-version local `stdio` transport, direct harness, cancellation, shutdown, framing, validators, and public tests. The transport does not activate repository reads, enabled tools, private Chronicle MCP, production agents, credentials, connectors, providers, or consequential actions. Sprint 7.3 is next.",
          )

          replace_once(
              "docs/roadmap/current-status.md",
              "[Forge boundary](../architecture/forge-mcp-boundary-and-tool-registry.md) · [Pre-Sprint 7 review]",
              "[Forge boundary](../architecture/forge-mcp-boundary-and-tool-registry.md) · [Local transport](../architecture/forge-mcp-local-stdio-transport.md) · [Pre-Sprint 7 review]",
          )
          replace_once(
              "docs/roadmap/current-status.md",
              "- **Current workstream:** 7.1 — Forge boundary and registry\n- **Runtime status:** bounded public repository gateway only",
              "- **Completed Sprint 7 workstreams:** 7.1 — Forge boundary and registry; 7.2 — local transport\n- **Current workstream:** 7.3 — source catalogue and provenance\n- **Runtime status:** bounded public repository gateway plus local Forge `stdio` transport with no enabled tools or repository reads",
          )
          replace_once(
              "docs/roadmap/current-status.md",
              "The [Pre-Sprint 7 Alignment Review](pre-sprint-7-alignment-review.md) merged through PR #52 as squash commit `a41ca5ad9d2c0fe8a009946f376705bb7910e223`. Sprint 7 is active through issue #54 and draft PR #55. Workstream 7.1 defines the contract-only Forge application boundary, public source classes, server-owned tool registry, risk classes, planned tool identities, prohibited capabilities, compatibility, migration references, resource-limit contracts, non-authority, funding neutrality, validators, and public tests.",
              "The [Pre-Sprint 7 Alignment Review](pre-sprint-7-alignment-review.md) merged through PR #52 as squash commit `a41ca5ad9d2c0fe8a009946f376705bb7910e223`. Sprint 7 is active through issue #54 and draft PR #55. Workstreams 7.1 and 7.2 define the Forge application boundary, public source classes, server-owned tool registry, risk classes, planned tool identities, prohibited capabilities, finalized-version local `stdio` transport, direct harness, cancellation, shutdown, framing, public-safe errors, compatibility references, non-authority, funding neutrality, validators, and public tests. All tools remain unexposed and no repository read exists yet.",
          )
          replace_once(
              "docs/roadmap/current-status.md",
              "| Sprint 7.1 — Forge boundary and registry | issue #54; draft PR #55; [plan](sprint-7-execution-plan.md); [architecture](../architecture/forge-mcp-boundary-and-tool-registry.md) | contract-only application ownership, public source classes, server-owned registry, risk classes, planned tools, prohibitions, validators, and public tests | MCP transport, repository reads, enabled tools, remote hosting, private data, mutation, provider calls, or production readiness |",
              "| Sprint 7.1 — Forge boundary and registry | issue #54; draft PR #55; [plan](sprint-7-execution-plan.md); [architecture](../architecture/forge-mcp-boundary-and-tool-registry.md) | application ownership, public source classes, server-owned registry, risk classes, planned tools, prohibitions, validators, and public tests | MCP transport, repository reads, enabled tools, remote hosting, private data, mutation, provider calls, or production readiness |\n| Sprint 7.2 — Local transport | issue #54; draft PR #55; [transport](../architecture/forge-mcp-local-stdio-transport.md) | finalized-version local `stdio`, initialization, empty tool discovery, cancellation, shutdown, framing, errors, direct harness, and tests | repository reads, enabled tools, source provenance, remote hosting, private data, providers, or production readiness |",
          )
          replace_once(
              "docs/roadmap/current-status.md",
              "- [`apps/mcp-forge`](../../apps/mcp-forge) — active Sprint 7 contract-only Forge boundary; all tools remain planned and unexposed",
              "- [`apps/mcp-forge`](../../apps/mcp-forge) — active Sprint 7 Forge boundary and local `stdio` transport; all tools remain planned and unexposed and repository reads remain disabled",
          )
          PY

      - name: Format repository
        run: pnpm format

      - name: Remove helper and commit
        shell: bash
        run: |
          git rm .github/workflows/apply-sprint-7-2-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: record Sprint 7.2 local transport"
          git push origin "HEAD:${GITHUB_REF_NAME}"
