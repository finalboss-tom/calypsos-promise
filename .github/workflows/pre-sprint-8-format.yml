name: Pre-Sprint 8 formatter

on:
  push:
    branches:
      - agent/pre-sprint-8-reconciliation
    paths:
      - .github/workflows/pre-sprint-8-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pre-sprint-8-reconciliation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply formatter
        run: pnpm format
      - name: Remove temporary workflow
        run: rm .github/workflows/pre-sprint-8-format.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply pre-Sprint 8 formatting"
          git push origin HEAD:agent/pre-sprint-8-reconciliation
