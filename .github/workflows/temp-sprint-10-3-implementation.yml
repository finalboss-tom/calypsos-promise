name: Temporary Sprint 10.3 implementation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-3-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply bounded Sprint 10.3 implementation
        run: |
          base64 --decode tools/temp-sprint-10-3.tar.gz.b64 > /tmp/sprint-10-3.tar.gz
          tar -xzf /tmp/sprint-10-3.tar.gz

      - name: Format Sprint 10.3 implementation
        run: >-
          pnpm exec prettier --write
          apps/game
          docs/roadmap/sprint-10.3-universal-shell-and-navigation.md

      - name: Validate shell contract
        run: pnpm --filter @calypsos-promise/game validate:shell

      - name: Run permanent repository validation
        run: pnpm check

      - name: Export browser, iOS, and Android bundles
        run: pnpm --filter @calypsos-promise/game build

      - name: Remove generated application state
        run: pnpm --filter @calypsos-promise/game clean

      - name: Commit validated implementation
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game docs/roadmap/sprint-10.3-universal-shell-and-navigation.md
          git commit -s -m "feat: implement Sprint 10.3 universal shell"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
