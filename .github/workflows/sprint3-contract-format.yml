name: Sprint 3 contract formatting

on:
  push:
    branches:
      - sprint/3-canonical-data-model-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 3 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/3-canonical-data-model-v1
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Sprint 3 contract files
        run: >-
          pnpm prettier --write
          docs/product/living-chronicle-schema-baseline.md
          packages/health-schema/src/types.ts

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product/living-chronicle-schema-baseline.md packages/health-schema/src/types.ts
          git commit -m "chore: format Chronicle schema contracts"
          git push origin HEAD:sprint/3-canonical-data-model-v1
