name: Apply Sprint 8.2 Next.js shell

on:
  push:
    branches:
      - agent/sprint-8-public-website-foundation
    paths:
      - .github/workflows/apply-sprint-8-2.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-sprint-8-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sprint-8-public-website-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Apply, validate, and record result
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/sprint-8-2.log) 2>&1

          rm -rf apps/site/src/app apps/site/src/views apps/site/test apps/site/public/styles
          rm -f apps/site/src/server.mjs apps/site/src/signup.mjs apps/site/src/check-site.mjs apps/site/public/site.js
          printf '%s' '' | base64 --decode > /tmp/sprint-8-2-site.tar.gz
          tar -xzf /tmp/sprint-8-2-site.tar.gz

          pnpm install --no-frozen-lockfile
          status=$?
          if [ "$status" -eq 0 ]; then pnpm format; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm --filter @calypsos-promise/site build; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm --filter @calypsos-promise/site lint; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm --filter @calypsos-promise/site typecheck; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm --filter @calypsos-promise/site test; status=$?; fi

          rm -f .github/workflows/apply-sprint-8-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            mkdir -p docs/roadmap
            {
              echo "# Sprint 8.2 Bootstrap Failure"
              echo
              echo "The branch-scoped setup run failed before workstream acceptance."
              echo
              echo '```text'
              tail -n 160 /tmp/sprint-8-2.log
              echo '```'
            } > docs/roadmap/sprint-8-workstream-8-2-bootstrap-failure.md
            git add -A
            git commit -m "chore: record Sprint 8.2 bootstrap failure"
            git push origin HEAD:agent/sprint-8-public-website-foundation
            exit 0
          fi

          rm -f docs/roadmap/sprint-8-workstream-8-2-bootstrap-failure.md
          git add -A
          git commit -m "feat: add Sprint 8.2 Next.js shell"
          git push origin HEAD:agent/sprint-8-public-website-foundation
