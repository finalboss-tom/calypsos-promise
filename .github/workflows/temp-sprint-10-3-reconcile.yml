name: Temporary Sprint 10.3 reconciliation

on:
  push:
    branches:
      - agent/sprint-10-1-application-toolchain
    paths:
      - .github/workflows/temp-sprint-10-3-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sprint 10 branch
        uses: actions/checkout@v7
        with:
          ref: agent/sprint-10-1-application-toolchain
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reconcile Sprint 10.3 status and policy
        run: python tools/temp-reconcile-sprint-10-3.py

      - name: Make shell ownership and parity explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/sprint-10.3-universal-shell-and-navigation.md")
          text = path.read_text()
          old = "Establish the first universal no-account application shell over the accepted `packages/game-content` contract."
          new = "Establish the first universal no-account application shell in `apps/game` over the accepted `packages/game-content` contract."
          if old not in text:
              raise SystemExit("missing 10.3 application-ownership sentence")
          text = text.replace(old, new, 1)
          old = "The public synthetic application opens without an account and gives equal prominence to narrative, direct, and map entry paths."
          new = "The public synthetic application opens without an account and gives equal prominence to direct and narrative entry paths, with the island map equally available."
          if old not in text:
              raise SystemExit("missing 10.3 entry-parity sentence")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format reconciled records
        run: >-
          pnpm exec prettier --write
          docs/roadmap/sprint-10.3-universal-shell-and-navigation.md
          docs/roadmap/current-status.md
          tools/policy/check-longitudinal-intelligence.mjs

      - name: Validate reconciled repository
        run: pnpm check

      - name: Commit reconciliation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/sprint-10.3-universal-shell-and-navigation.md docs/roadmap/current-status.md tools/policy/check-longitudinal-intelligence.mjs
          git commit -s -m "docs: reconcile Sprint 10.3 checkpoint"
          git push origin HEAD:agent/sprint-10-1-application-toolchain
