name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: pnpm format:check
      - name: Prepare formatting fixes
        if: steps.formatting.outcome == 'failure'
        run: |
          pnpm format
          git diff --binary > formatting.patch
          git diff --name-only -z | tar --null -T - -czf formatted-files.tar.gz
      - name: Upload formatting fixes
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: formatting-fixes
          path: |
            formatting.patch
            formatted-files.tar.gz
          if-no-files-found: error
      - name: Fail on formatting differences
        if: steps.formatting.outcome == 'failure'
        run: exit 1

  validate:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: documentation-links
            command: pnpm docs:check
          - name: repository-policy
            command: pnpm policy:check
          - name: economics-validation
            command: pnpm economics:check
          - name: content-validation
            command: pnpm content:check
          - name: lint
            command: pnpm lint
          - name: typecheck
            command: pnpm typecheck
          - name: tests
            command: pnpm test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
