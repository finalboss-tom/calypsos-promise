name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: pnpm format:check
      - name: Apply formatter output to same-repository review branch
        if: >-
          steps.formatting.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          pnpm format
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: apply formatter output"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Prepare formatting fixes for external branches
        if: >-
          steps.formatting.outcome == 'failure' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          pnpm format
          git diff --binary > formatting.patch
          git diff --name-only -z | tar --null -T - -czf formatted-files.tar.gz
      - name: Upload formatting fixes for external branches
        if: >-
          steps.formatting.outcome == 'failure' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: formatting-fixes
          path: |
            formatting.patch
            formatted-files.tar.gz
          if-no-files-found: error
      - name: Fail when formatter output was not applied
        if: >-
          steps.formatting.outcome == 'failure' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository)
        run: exit 1

  validate:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: documentation-links
            command: pnpm docs:check
          - name: repository-policy
            command: pnpm policy:check
          - name: economics-validation
            command: pnpm economics:check
          - name: content-validation
            command: pnpm content:check
          - name: lint
            command: pnpm lint
          - name: typecheck
            command: pnpm typecheck
          - name: tests
            command: pnpm test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
