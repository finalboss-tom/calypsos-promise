name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: pnpm format:check
      - name: Prepare formatting fixes
        if: steps.formatting.outcome == 'failure'
        run: |
          pnpm format
          git diff --binary > formatting.patch
          git diff --name-only -z | tar --null -T - -czf formatted-files.tar.gz
      - name: Upload formatting fixes
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: formatting-fixes
          path: |
            formatting.patch
            formatted-files.tar.gz
          if-no-files-found: error
      - name: Fail on formatting differences
        if: steps.formatting.outcome == 'failure'
        run: exit 1

  validate:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: documentation-links
            command: pnpm docs:check
          - name: repository-policy
            command: pnpm policy:check
          - name: economics-validation
            command: pnpm economics:check
          - name: content-validation
            command: pnpm content:check
          - name: lint
            command: pnpm lint
          - name: typecheck
            command: pnpm typecheck
          - name: tests
            command: pnpm test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  game-toolchain-validation:
    name: game-toolchain-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate application and toolchain boundary
        run: pnpm --filter @calypsos-promise/game validate:toolchain
      - name: Validate build, release, rollback, and operations evidence
        run: pnpm --filter @calypsos-promise/game validate:operations
      - name: Export browser, iOS, and Android bundles without credentials
        run: pnpm --filter @calypsos-promise/game build
      - name: Write deterministic unsigned build evidence
        run: pnpm --filter @calypsos-promise/game build:evidence -- --source "$GITHUB_SHA"
      - name: Validate deterministic unsigned build evidence
        run: |
          test -f apps/game/dist/build-evidence.json
          pnpm --filter @calypsos-promise/game validate:build-evidence -- --path dist/build-evidence.json --source "$GITHUB_SHA"
      - name: Remove generated application state
        if: always()
        run: pnpm --filter @calypsos-promise/game clean
      - name: Verify no tracked build mutation
        if: always()
        run: git diff --exit-code

  site-release-validation:
    name: site-release-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production site
        run: pnpm --filter @calypsos-promise/site build
      - name: Start isolated local production preview
        run: |
          pnpm --filter @calypsos-promise/site exec next start -H 127.0.0.1 -p 3000 > site-preview.log 2>&1 &
          echo $! > site-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat site-preview.log
          exit 1
      - name: Validate routes, accessibility contracts, headers, metadata, authority, signup, and budgets
        env:
          SITE_BASE_URL: http://127.0.0.1:3000
          SITE_RELEASE_REPORT: site-release-evidence.json
        run: pnpm --filter @calypsos-promise/site validate:preview
      - name: Validate rendered prologue journeys
        env:
          SITE_BASE_URL: http://127.0.0.1:3000
          SITE_RELEASE_REPORT: site-release-evidence.json
          PROLOGUE_BROWSER_REPORT: prologue-browser-evidence/report.json
          PROLOGUE_SCREENSHOT_DIR: prologue-browser-evidence/screenshots
        run: pnpm --filter @calypsos-promise/site validate:prologue-browser
      - name: Upload local preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-release-evidence
          path: |
            apps/site/site-release-evidence.json
            apps/site/prologue-browser-evidence
            site-preview.log
          if-no-files-found: warn
      - name: Stop preview and remove generated state
        if: always()
        run: |
          if [ -f site-preview.pid ]; then
            kill "$(cat site-preview.pid)" || true
          fi
          git checkout -- apps/site/tsconfig.json apps/site/next-env.d.ts || true
          rm -f apps/site/tsconfig.tsbuildinfo apps/site/site-release-evidence.json site-preview.pid
          rm -rf apps/site/.next apps/site/prologue-browser-evidence
      - name: Verify no tracked build mutation
        if: always()
        run: git diff --exit-code
