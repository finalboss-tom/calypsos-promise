name: Temporary Sprint 10 post-merge reconciliation

on:
  push:
    branches:
      - agent/post-sprint-10-reconciliation
    paths:
      - .github/workflows/temp-sprint-10-post-merge-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      SPRINT10_ALLOW_TEMP_TRANSPORT: 1
    steps:
      - name: Check out post-merge branch
        uses: actions/checkout@v7
        with:
          ref: agent/post-sprint-10-reconciliation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify accepted squash tree
        run: |
          test "$(git rev-parse 28bb5a7ae268d28a67d737777cafdd760c796cd1^{tree})" = "$(git rev-parse edd954d0e5ce61f53918a74ec804964ad987830f^{tree})"

      - name: Apply post-merge reconciliation
        run: |
          python tools/temp-sprint-10-post-merge-reconciliation.py
          rm tools/temp-sprint-10-post-merge-reconciliation.py
          test ! -e tools/temp-sprint-10-post-merge-reconciliation.py

      - name: Normalize accepted merge evidence wording
        run: |
          python - <<'PY'
          from pathlib import Path

          merge_sha = "28bb5a7ae268d28a67d737777cafdd760c796cd1"
          accepted_head = "edd954d0e5ce61f53918a74ec804964ad987830f"

          docs_path = Path("docs/README.md")
          docs = docs_path.read_text()
          old = (
              f"The Sprint 10 implementation package passed pre-acceptance alignment at `{accepted_head}` — "
              f"CI 1519 / DCO 1624 — and was accepted and squash merged through PR #79 as `{merge_sha}`. "
              "The post-merge reconciliation confirms unchanged authority and release boundaries. "
              "Sprint 11 remains unstarted."
          )
          new = (
              f"Sprint 10 is accepted and squash merged through PR #79 as `{merge_sha}` after the "
              f"implementation package passed pre-acceptance alignment at `{accepted_head}` — "
              "CI 1519 / DCO 1624. The post-merge reconciliation confirms unchanged authority "
              "and release boundaries. Sprint 11 remains unstarted."
          )
          if docs.count(old) != 1:
              raise SystemExit(
                  f"docs/README.md accepted-state anchor: expected one match, found {docs.count(old)}"
              )
          docs_path.write_text(docs.replace(old, new, 1))

          game_path = Path("apps/game/README.md")
          game = game_path.read_text()
          old = (
              "The application is merged into `main` but remains unhosted, unsigned, "
              "undistributed, and non-authoritative. Sprint 11 remains unstarted."
          )
          new = (
              f"The application is merged into `main` at Sprint 10 squash commit `{merge_sha}` "
              "but remains unhosted, unsigned, undistributed, and non-authoritative. "
              "Sprint 11 remains unstarted."
          )
          if game.count(old) != 1:
              raise SystemExit(
                  f"apps/game/README.md merge-SHA anchor: expected one match, found {game.count(old)}"
              )
          game_path.write_text(game.replace(old, new, 1))
          PY

      - name: Format reconciled records
        run: >-
          pnpm exec prettier --write
          README.md
          apps/game/README.md
          apps/site/README.md
          docs/README.md
          docs/architecture/README.md
          docs/architecture/universal-game-shell-sprint-10-cross-contract-reconciliation.md
          docs/product/README.md
          docs/roadmap/README.md
          docs/roadmap/current-status.md
          docs/roadmap/post-sprint-10-reconciliation-and-sprint-11-preparation.md
          docs/roadmap/sprint-10-completion-record.md
          docs/roadmap/sprint-10-final-reconciliation-and-sprint-11-handoff.md
          docs/roadmap/sprint-10-pre-acceptance-alignment-reconciliation.md
          tools/policy/check-longitudinal-intelligence.mjs
          tools/policy/check-sprint-10-completion.mjs

      - name: Validate complete repository
        run: pnpm check

      - name: Validate production site and rendered prologue
        run: |
          pnpm --filter @calypsos-promise/site build
          pnpm --filter @calypsos-promise/site exec next start -H 127.0.0.1 -p 3000 > site-preview.log 2>&1 &
          echo $! > site-preview.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat site-preview.log
            exit 1
          fi
          SITE_BASE_URL=http://127.0.0.1:3000 SITE_RELEASE_REPORT=site-release-evidence.json pnpm --filter @calypsos-promise/site validate:preview
          SITE_BASE_URL=http://127.0.0.1:3000 SITE_RELEASE_REPORT=site-release-evidence.json PROLOGUE_BROWSER_REPORT=prologue-browser-evidence/report.json PROLOGUE_SCREENSHOT_DIR=prologue-browser-evidence/screenshots pnpm --filter @calypsos-promise/site validate:prologue-browser
          if [ -f site-preview.pid ]; then
            kill "$(cat site-preview.pid)" || true
          fi
          git checkout -- apps/site/tsconfig.json apps/site/next-env.d.ts || true
          rm -f apps/site/tsconfig.tsbuildinfo apps/site/site-release-evidence.json site-preview.pid site-preview.log
          rm -rf apps/site/.next apps/site/prologue-browser-evidence

      - name: Create signed post-merge candidate
        run: |
          git config user.name "Tom"
          git config user.email "109227940+finalboss-tom@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile Sprint 10 merge" -m "Signed-off-by: Tom <109227940+finalboss-tom@users.noreply.github.com>"

      - name: Export and validate universal application evidence
        run: |
          pnpm --filter @calypsos-promise/game build
          SOURCE_REVISION="$(git rev-parse HEAD)"
          pnpm --filter @calypsos-promise/game build:evidence -- --source "$SOURCE_REVISION"
          test -f apps/game/dist/build-evidence.json
          pnpm --filter @calypsos-promise/game validate:build-evidence -- --path dist/build-evidence.json --source "$SOURCE_REVISION"
          pnpm --filter @calypsos-promise/game clean
          test ! -e apps/game/dist
          test ! -e apps/game/.expo
          test ! -e apps/game/android
          test ! -e apps/game/ios

      - name: Verify clean candidate and publish
        run: |
          git diff --exit-code
          git pull --rebase origin agent/post-sprint-10-reconciliation
          git push origin HEAD:agent/post-sprint-10-reconciliation
