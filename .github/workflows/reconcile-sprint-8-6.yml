name: Reconcile Sprint 8.6 status

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-sprint-8-6.yml
      - .github/scripts/reconcile_sprint_8_6.py
      - README.md
      - apps/site/README.md
      - docs/README.md
      - docs/architecture/README.md
      - docs/roadmap/README.md
      - docs/roadmap/current-status.md
      - docs/roadmap/sprint-8-execution-plan.md

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sprint-8-public-website-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/reconcile_sprint_8_6.py
      - run: pnpm format
      - name: Remove temporary reconciliation files
        run: |
          rm .github/workflows/reconcile-sprint-8-6.yml
          rm .github/scripts/reconcile_sprint_8_6.py
          rm -f .github/workflows/activate-reconcile-sprint-8-6.yml
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: reconcile Sprint 8.6 status"
          git push origin HEAD:agent/sprint-8-public-website-foundation
