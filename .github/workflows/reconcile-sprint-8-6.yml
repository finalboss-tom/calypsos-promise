name: Reconcile Sprint 8.6 status

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-sprint-8-6.yml
      - README.md
      - apps/site/README.md
      - docs/README.md
      - docs/architecture/README.md
      - docs/roadmap/README.md
      - docs/roadmap/current-status.md
      - docs/roadmap/sprint-8-execution-plan.md

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sprint-8-public-website-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile repository status
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              file.write_text(text, encoding="utf-8")

          edit("docs/roadmap/current-status.md", [
              ("[Workstream 8.5 record](sprint-8-workstream-8-5-record.md)", "[Workstream 8.6 record](sprint-8-workstream-8-6-record.md)"),
              ("- **Completed workstreams:** 8.1 through 8.5\n- **Next workstream:** 8.6 — Trust Center and Open Forge", "- **Completed workstreams:** 8.1 through 8.6\n- **Next workstream:** 8.7 — Roadmap, capability status, support, and canonical funding transparency"),
              ("- **Website runtime:** validated Next.js App Router site with homepage, Promise, Seven Laws, How It Works, consumer-first, Aster, navigation, status, and accessibility foundations; not deployed or officially released", "- **Website runtime:** validated Next.js App Router site with homepage, Promise, Seven Laws, How It Works, consumer-first, Aster, Trust Center, Open Forge, navigation, status, and accessibility foundations; not deployed or officially released"),
              ("The controlling evidence is [Sprint 8.5 Record](sprint-8-workstream-8-5-record.md).\n\n## Current public website surface", "The controlling evidence is [Sprint 8.5 Record](sprint-8-workstream-8-5-record.md).\n\n## Workstream 8.6 — validated Trust Center and Open Forge\n\nWorkstream 8.6 established:\n\n- `/trust` with source-backed player rights, public/private information boundaries, truthful security status, authority separation, provider and connector status, funding doctrine, public and private challenge routes, and open operational and independent-review gates;\n- `/forge` with all ten accepted local public/synthetic tool identities, runtime and source boundaries, receipts, public-safe errors, tool-specific denials, open holdpoints, unresolved work, and ordinary non-MCP contribution paths;\n- direct and narrative navigation parity, footer links, canonical metadata, and sitemap inclusion for both routes;\n- server-rendered essential information without a client-component dependency;\n- inherited keyboard, focus, responsive, reduced-data, contrast, forced-colors, and image-failure behavior; and\n- deterministic trust, tool-registry, receipt, error, route, signup, deployment, and non-certification validation.\n\nThe focused validation workflow passed formatting, a production site build, site lint, typecheck, focused tests, generated-state cleanup, and self-removal before producing clean candidate `e43d0a47186041599674f6608455752a4e3b7319`.\n\nThe controlling evidence is [Sprint 8.6 Record](sprint-8-workstream-8-6-record.md).\n\n## Current public website surface"),
              ("- `/promise`, `/laws`, `/how-it-works`, `/consumer-first`, and `/aster` source-backed routes;", "- `/promise`, `/laws`, `/how-it-works`, `/consumer-first`, `/aster`, `/trust`, and `/forge` source-backed routes;"),
              ("- Trust Center or Open Forge routes;\n", ""),
              ("## Next workstream\n\nWorkstream 8.6 may now implement:\n\n- a Trust Center organizing player rights, privacy, security disclosure, authority boundaries, provider and connector status, funding doctrine, open holdpoints, corrections, and challenge routes; and\n- an Open Forge page explaining the ten bounded local public/synthetic tools, provenance, scopes, limits, receipts, errors, compatibility, non-authority, and ordinary non-MCP contribution path.\n\nIt must preserve frozen authority, the accepted page family, direct and narrative navigation parity, controlled status values, canonical source links, server-rendered essential information, provider independence, Aster and Forge non-authority, accessibility and resilience foundations, paused signup, disabled deployment, and every permanent Sprint 8 non-scope boundary.\n\nIt may not claim certification, production safety, private-data capability, provider capability, clinical capability, transactions, or Sprint 9 gameplay.", "## Next workstream\n\nWorkstream 8.7 may now implement:\n\n- roadmap and capability-status views derived from validated site-local presentation records with canonical repository sources;\n- public support and contribution routes that do not become private customer-support, account, provider-intake, research-enrollment, or transaction systems;\n- canonical funding and relationship transparency derived from approved public economics records or honest empty states; and\n- approved and prohibited benefit, conflict, concentration, outcome, correction, and challenge explanations with transactions disabled.\n\nIt must preserve the accepted page family, canonical source authority, controlled evidence statuses, funding neutrality, server-rendered essential information, accessibility and resilience foundations, paused signup, disabled deployment, and every permanent Sprint 8 non-scope boundary.\n\nIt may not activate donations, sponsorship checkout, payments, charitable or tax claims, nonprofit or public-benefit claims, provider intake, connector placement, ranking, private support records, or Sprint 9 gameplay."),
              ("- [`apps/site`](../../apps/site) — validated source-backed public website foundation through workstream 8.5; not deployed", "- [`apps/site`](../../apps/site) — validated source-backed public website foundation through workstream 8.6; not deployed"),
          ])

          edit("docs/roadmap/sprint-8-execution-plan.md", [
              ("[Workstream 8.5 record](sprint-8-workstream-8-5-record.md)", "[Workstream 8.6 record](sprint-8-workstream-8-6-record.md)"),
              ("- **Status:** ACTIVE — workstreams 8.1 through 8.5 complete; workstream 8.6 next", "- **Status:** ACTIVE — workstreams 8.1 through 8.6 complete; workstream 8.7 next"),
              ("- [ ] **8.6 — Trust Center and Open Forge — NEXT**\n- [ ] **8.7 — Roadmap, capability status, support, and funding transparency**", "- [x] **8.6 — Trust Center and Open Forge**\n- [ ] **8.7 — Roadmap, capability status, support, and funding transparency — NEXT**"),
              ("## 8.6 — Trust Center and Open Forge\n\nDeliverables:\n\n- Trust Center shell organizing rights, privacy, security disclosure, authority boundaries, provider and connector status, funding doctrine, open holdpoints, corrections, and challenge routes;\n- Open Forge page describing the ten bounded local public/synthetic tools, provenance, limits, receipts, errors, compatibility, non-authority, and ordinary non-MCP contribution path; and\n- no certification or production-safety overstatement.\n\nWorkstream 8.6 must preserve the accepted homepage and guide family, frozen authority, direct/narrative parity, controlled statuses, canonical source links, server-rendered essential information, provider independence, Aster and Forge non-authority, accessibility/resilience controls, paused signup, disabled deployment, and permanent non-scope.\n\n## 8.7 — roadmap, capability status, support, and funding transparency", "## 8.6 result — Trust Center and Open Forge\n\nWorkstream 8.6 established:\n\n- `/trust` with the public rights floor, publication boundary, designed-versus-deployed security status, authority separation, provider and connector status, funding doctrine, public and private challenge routes, and open review gates;\n- `/forge` with the exact ten-tool local public/synthetic registry, source provenance, scopes, limits, receipts, public-safe errors, compatibility and non-authority boundaries, open holdpoints, and ordinary non-MCP contribution paths;\n- direct and narrative navigation parity, footer links, canonical metadata, and sitemap inclusion;\n- server-rendered essential information without `use client`;\n- responsive Trust and Forge layouts with reduced-data, contrast, and forced-colors behavior; and\n- expanded source, trust, tool-registry, receipt, error, route, signup, deployment, and non-certification validation.\n\nThe first full repository pass passed every substantive job and found only canonical formatting differences. The self-removing focused workflow then passed formatting, the production site build, site lint, typecheck, focused tests, generated-state cleanup, final formatting, and cleanup before producing candidate `e43d0a47186041599674f6608455752a4e3b7319`.\n\nThe controlling evidence is [Sprint 8.6 Record](sprint-8-workstream-8-6-record.md).\n\n## 8.7 — roadmap, capability status, support, and funding transparency — NEXT"),
          ])

