name: Validate Sprint 8.7 public records

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-sprint-8-7.yml
      - apps/site/**
      - docs/economics/funding-records.yml
      - docs/economics/funding-opportunities.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sprint-8-public-website-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm --filter @calypsos-promise/site build
      - run: pnpm --filter @calypsos-promise/site lint
      - run: pnpm --filter @calypsos-promise/site typecheck
      - run: pnpm --filter @calypsos-promise/site test
      - name: Remove generated build state
        run: |
          rm -f apps/site/tsconfig.tsbuildinfo
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "apps/site/tsconfig.json";
          const config = JSON.parse(readFileSync(path, "utf8"));
          if (config.compilerOptions) {
            delete config.compilerOptions.incremental;
          }
          writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - run: pnpm format
      - run: rm .github/workflows/validate-sprint-8-7.yml
      - name: Commit validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: validate Sprint 8.7 public records"
          git push origin HEAD:agent/sprint-8-public-website-foundation
