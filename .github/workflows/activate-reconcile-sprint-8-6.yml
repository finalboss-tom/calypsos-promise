name: Activate Sprint 8.6 reconciliation

on:
  push:
    branches:
      - agent/sprint-8-public-website-foundation
    paths:
      - .github/workflows/activate-reconcile-sprint-8-6.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sprint-8-public-website-foundation
          fetch-depth: 0
      - name: Switch reconciliation to branch push
        run: |
          # This second revision exists only to trigger the already-present workflow.
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/reconcile-sprint-8-6.yml')
          text = path.read_text(encoding='utf-8')
          old = '''on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-sprint-8-6.yml
      - README.md
      - apps/site/README.md
      - docs/README.md
      - docs/architecture/README.md
      - docs/roadmap/README.md
      - docs/roadmap/current-status.md
      - docs/roadmap/sprint-8-execution-plan.md
'''
          new = '''on:
  push:
    branches:
      - agent/sprint-8-public-website-foundation
    paths:
      - .github/workflows/reconcile-sprint-8-6.yml
'''
          if text.count(old) != 1:
              raise SystemExit('reconciliation trigger block did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/activate-reconcile-sprint-8-6.yml
      - name: Commit trigger correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: activate Sprint 8.6 reconciliation"
          git push origin HEAD:agent/sprint-8-public-website-foundation
