name: Sprint 3 formatting repair

on:
  push:
    branches:
      - sprint/3-canonical-data-model-v1
    paths:
      - .github/workflows/sprint-3-format-repair.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact repository formatting
        run: pnpm exec prettier --write docs/architecture/living-chronicle-correction-conflict-supersession.md

      - name: Commit formatting repair
        run: |
          if git diff --quiet -- docs/architecture/living-chronicle-correction-conflict-supersession.md; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/living-chronicle-correction-conflict-supersession.md
          git commit -m "style: apply Sprint 3 formatting"
          git push origin HEAD:sprint/3-canonical-data-model-v1
